services:
  cassandra:
    image: cassandra:5.0
    container_name: cassandra-vector
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_ENABLE_VECTOR=true
    volumes:
      - ./cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15